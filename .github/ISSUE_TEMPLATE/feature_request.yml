name: Usulan fitur (Feature request)
description: Usulkan fitur atau perbaikan. / Suggest a feature or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Periksa dulu peta jalan di README dan isu yang sudah ada. / Check the roadmap in the README and the existing
        issues first.
  - type: textarea
    id: problem
    attributes:
      label: Masalah yang ingin diselesaikan (The problem)
      description: Apa yang sulit atau belum bisa dilakukan perpustakaan Anda? / What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Usulan (Proposal)
      description: Bagaimana sebaiknya ALTIS membantu? / How should ALTIS help?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatif yang sudah dicoba (Alternatives considered)
  - type: textarea
    id: context
    attributes:
      label: Konteks (Context)
      description: |
        Jenis perpustakaan, jumlah koleksi atau pengguna, dan cara kerja di SLiMS atau sistem lain bila relevan.
        Library type, collection or user counts, and how SLiMS or another system handles it, if relevant.
