<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csp-nonce" content="__CSP_NONCE__" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ALTIS Admin</title>
    <!-- The site icon: the library's own when it set one, else the built-in one; the server answers both. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/site-icon/32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/site-icon/192.png" />
    <link rel="apple-touch-icon" href="/site-icon/180.png" />
    <!-- The colour theme chosen in this browser (src/lib/theme.ts), applied before the first paint. -->
    <script nonce="__CSP_NONCE__">
      (function () {
        try {
          var choice = window.localStorage.getItem('altis.admin.theme');
          if (choice === 'light' || choice === 'dark') document.documentElement.setAttribute('data-theme', choice);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ALTIS Admin membutuhkan JavaScript. / ALTIS Admin needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
